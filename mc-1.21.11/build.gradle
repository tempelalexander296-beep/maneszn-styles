plugins {
	id 'net.fabricmc.fabric-loom-remap'
}

version = "24.0.0"
group = rootProject.maven_group
base { archivesName = "maneszn-styles" }

loom {
	splitEnvironmentSourceSets()
	mods {
		"maneszn_styles" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets {
	main { java { srcDir rootProject.file('common/src/main/java') } }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def v = project.version
	inputs.property "version", v
	from(rootProject.file('common/src/main/resources'))
	filesMatching("fabric.mod.json") { expand "version": v }
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.withType(JavaCompile).configureEach { it.options.release = Integer.parseInt(project.java_release); it.options.encoding = 'UTF-8' }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "adventcosmetics-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = false
	}
}
